name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - ipq50xx-mainline-kernel-6.12-openwrt-25.12
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
          nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget device-tree-compiler

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure the Redmi AX3000 (32-bit ARM) profile
        run: |
          cat <<'EOF' | sed -E 's/^[[:space:]]+//' > .config
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_arm=y
          CONFIG_TARGET_qualcommax_arm_DEVICE_redmi_ax3000=y
          # Warnings are not errors on this all-32-bit port.
          # CONFIG_KERNEL_WERROR is not set
          # GCC 14 promotes these to errors by default; the vendor switch
          # package (qca-ssdk) trips over them when built for 32-bit ARM.
          CONFIG_EXTRA_OPTIMIZATION="-Wno-error=incompatible-pointer-types -Wno-error=int-conversion"
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl-openssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          EOF
          make defconfig
          echo '### Selected config' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'TARGET_qualcommax|DEVICE_redmi_ax3000|PACKAGE_luci' .config \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Fail fast if the device did not survive defconfig, otherwise the
          # build runs for more than an hour before failing with no images.
          grep -q '^CONFIG_TARGET_qualcommax_arm_DEVICE_redmi_ax3000=y' .config || {
            echo "::error ::redmi_ax3000 device selection missing from .config"
            grep -E 'TARGET_qualcommax' .config || true
            exit 1
          }
          grep -q '^CONFIG_TARGET_qualcommax_arm=y' .config || {
            echo "::error ::the arm subtarget was not selected"
            exit 1
          }

      - name: Pre-flight makefile parse check
        run: |
          # ipq-wifi is only fully evaluated during the build, so a syntax
          # error there would otherwise surface after compiling for an hour.
          if ! make -C package/firmware/ipq-wifi -n \
                 "TOPDIR=$PWD" CONFIG_PACKAGE_ipq-wifi-redmi_ax3000=y >/dev/null; then
            echo "::error ::ipq-wifi Makefile failed to parse"
            exit 1
          fi
          echo "ipq-wifi Makefile parses OK"

      - name: Download package sources
        run: make -j"$(nproc)" download

      - name: Prepare kernel and generate its config
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" target/linux/prepare V=s 2>&1 | tee /tmp/kernel-prepare.log | tail -n 40; then
            echo "::error ::kernel prepare failed"
            tail -n 60 /tmp/kernel-prepare.log | while IFS= read -r line; do
              echo "::error ::${line:0:850}"
            done
            exit 1
          fi

      - name: Pre-flight device tree check
        run: |
          # Compile the board DTS on its own: the kernel Kbuild would only
          # touch it at the very end of an hour long build, and a typo there
          # is by far the most likely failure for a new board description.
          set -o pipefail
          LINUX_DIR="$(ls -d build_dir/target-*/linux-*/linux-* | head -1)"
          echo "LINUX_DIR=$LINUX_DIR"
          DTS="$LINUX_DIR/arch/arm/boot/dts/qcom/ipq5018-redmi-ax3000.dts"
          test -f "$DTS" || { echo "::error ::board DTS not copied into the kernel tree"; exit 1; }

          cpp -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
              -I"$LINUX_DIR/arch/arm/boot/dts" \
              -I"$LINUX_DIR/arch/arm/boot/dts/include" \
              -I"$LINUX_DIR/include" \
              -I"$LINUX_DIR/scripts/dtc/include-prefixes" \
              "$DTS" > /tmp/board.dts.cooked 2> /tmp/cpp.log || {
            echo "::error ::device tree preprocessing failed"
            head -c 4000 /tmp/cpp.log | while IFS= read -r line; do
              echo "::error ::${line:0:850}"
            done
            exit 1
          }

          if ! dtc -I dts -O dtb -o /tmp/board.dtb /tmp/board.dts.cooked 2> /tmp/dtc.log; then
            echo "::error ::device tree compilation failed"
            head -c 4000 /tmp/dtc.log | while IFS= read -r line; do
              echo "::error ::${line:0:850}"
            done
            exit 1
          fi
          echo "board device tree compiles OK"

      - name: Build firmware
        run: |
          set -o pipefail
          df -h / >> /tmp/build.log
          make -j"$(nproc)" V=s 2>&1 | tee -a /tmp/build.log

      - name: Show build log on failure
        if: failure()
        run: |
          {
            echo '### Build failed - last 500 log lines'
            echo '```'
            tail -n 500 /tmp/build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error ::disk: $(df -h / | tail -n1 | tr -s ' ')"
          tail -n 600 /tmp/build.log > /tmp/window.log || true
          n=$(grep -nE 'make\[[0-9]+\]: \*\*\*|\*\*\* \[' /tmp/window.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then
            s=$((n > 9 ? n - 9 : 1))
            sed -n "${s},${n}p" /tmp/window.log | while IFS= read -r line; do
              echo "::error ::ctx: ${line:0:850}"
            done
          else
            tail -n 6 /tmp/build.log | while IFS= read -r line; do
              echo "::error ::tail: ${line:0:850}"
            done
          fi

      - name: Save full build log to build-log branch
        if: failure()
        run: |
          [ -f /tmp/build.log ] || exit 0
          cp /tmp/build.log build-failure.log
          gzip -9 -f build-failure.log
          ls -l build-failure.log.gz
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log-25.12
          git add -f build-failure.log.gz
          git commit -m "build failure log for ${GITHUB_SHA}" || true
          git push -f origin build-log-25.12

      - name: Collect firmware
        run: |
          mkdir -p output
          cp -v bin/targets/qualcommax/arm/*redmi_ax3000* output/ || true
          cp -v bin/targets/qualcommax/arm/sha256sums output/ || true
          ls -l output

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-redmi_ax3000-arm32
          path: output/*
          if-no-files-found: error
