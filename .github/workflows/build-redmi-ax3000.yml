name: Build ImmortalWrt for Redmi AX3000 (RA81)

on:
  workflow_dispatch:
  push:
    branches:
      - ax3000
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure the Redmi AX3000 profile
        run: |
          cat <<'EOF' | sed -E 's/^[[:space:]]+//' > .config
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_redmi_ax3000=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_ALL_PROFILES=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl-openssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          EOF
          make defconfig

      - name: Download package sources
        run: make -j"$(nproc)" download

      - name: Build firmware
        run: make -j"$(nproc)" V=s

      - name: Collect firmware
        run: |
          mkdir -p output
          cp -v bin/targets/qualcommax/ipq50xx/*redmi_ax3000* output/ || true
          cp -v bin/targets/qualcommax/ipq50xx/sha256sums output/ || true
          ls -l output

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-redmi_ax3000
          path: output/*
          if-no-files-found: error
