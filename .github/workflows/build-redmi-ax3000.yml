name: Build ImmortalWrt for Redmi AX3000 (RA81)

on:
  workflow_dispatch:
  push:
    branches:
      - ax3000
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
          nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure the Redmi AX3000 (32-bit ARM) profile
        run: |
          cat <<'EOF' | sed -E 's/^[[:space:]]+//' > .config
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_arm=y
          CONFIG_TARGET_qualcommax_arm_DEVICE_redmi_ax3000=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl-openssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          EOF
          make defconfig
          echo '### Selected config' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'TARGET_qualcommax|CONFIG_ARCH_QCOM_RESERVE_SMEM|DEVICE_redmi_ax3000|PACKAGE_luci' .config \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Fail fast if the device did not survive defconfig, otherwise the
          # build runs for more than an hour before failing on the metadata
          # step with an empty json_info_files directory.
          grep -q '^CONFIG_TARGET_qualcommax_arm_DEVICE_redmi_ax3000=y' .config || {
            echo "::error ::redmi_ax3000 device selection missing from .config"
            grep -E 'TARGET_qualcommax' .config || true
            exit 1
          }

      - name: Pre-flight makefile parse check
        run: |
          # These files are only fully evaluated during the build, so a syntax
          # error there would otherwise surface after compiling for an hour.
          # -C is important: the build system enters the package directory, and
          # some parse errors only show up in that invocation.
          if ! make -C package/firmware/ipq-wifi -n \
                 "TOPDIR=$PWD" CONFIG_PACKAGE_ipq-wifi-redmi_ax3000=y >/dev/null; then
            echo "::error ::ipq-wifi Makefile failed to parse"
            exit 1
          fi
          echo "ipq-wifi Makefile parses OK"

      - name: Download package sources
        run: make -j"$(nproc)" download

      - name: Prepare kernel and generate its config
        run: |
          # Runs the kernel download/patch/configure steps on their own so that
          # config problems surface in minutes instead of after the whole
          # toolchain has been built. The prepared tree is reused below.
          set -o pipefail
          if ! make -j"$(nproc)" target/linux/prepare V=s 2>&1 | tee /tmp/kernel-prepare.log | tail -n 40; then
            echo "::error ::kernel prepare failed"
            tail -n 60 /tmp/kernel-prepare.log | while IFS= read -r line; do
              echo "::error ::${line:0:850}"
            done
            exit 1
          fi

      # TEMPORARY helper: dump the arm32 kernel config as generated with the
      # real package set of this build, so it can be committed as a complete
      # config-6.18 for the arm subtarget. Removed again afterwards.
      - name: Dump the complete arm32 kernel config (temporary helper)
        run: |
          set -x
          make -j"$(nproc)" prepare-tmpinfo >/dev/null 2>&1 || true
          KDIR=$(echo "$PWD"/build_dir/target-arm_*/linux-qualcommax_arm/linux-*)
          ls -d "$KDIR"
          ./scripts/kconfig.pl + + \
            target/linux/generic/config-6.18 \
            target/linux/qualcommax/config-6.18 \
            target/linux/qualcommax/arm/config-6.18 > "$KDIR/.config.target"
          awk '/^(#[[:space:]]+)?CONFIG_KERNEL/{sub("CONFIG_KERNEL_","CONFIG_");print}' .config >> "$KDIR/.config.target"
          printf '# CONFIG_KALLSYMS_EXTRA_PASS is not set\n# CONFIG_KALLSYMS_ALL is not set\nCONFIG_KALLSYMS_UNCOMPRESSED=y\n' >> "$KDIR/.config.target"
          ./scripts/package-metadata.pl kconfig tmp/.packageinfo .config 6.18 > "$KDIR/.config.override"
          ./scripts/kconfig.pl 'm+' '+' "$KDIR/.config.target" /dev/null "$KDIR/.config.override" > "$KDIR/.config"
          make -C "$KDIR" ARCH=arm CROSS_COMPILE= CC=true olddefconfig </dev/null
          cp "$KDIR/.config" arm32-kernel.config
          wc -l arm32-kernel.config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B kernel-config
          git add -f arm32-kernel.config
          git commit -m "arm32 kernel config dump" || true
          git push -f origin kernel-config
          exit 1

      - name: Build firmware
        run: |
          set -o pipefail
          df -h / >> /tmp/build.log
          make -j"$(nproc)" V=s 2>&1 | tee /tmp/build.log

      - name: Show build log on failure
        if: failure()
        run: |
          {
            echo '### Build failed - last 500 log lines'
            echo '```'
            tail -n 500 /tmp/build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Annotations are readable without repository admin rights.
          echo "::error ::disk: $(df -h / | tail -n1 | tr -s ' ')"
          tail -n 600 /tmp/build.log > /tmp/window.log || true
          n=$(grep -nE 'make\[[0-9]+\]: \*\*\*|\*\*\* \[' /tmp/window.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then
            s=$((n > 9 ? n - 9 : 1))
            sed -n "${s},${n}p" /tmp/window.log | while IFS= read -r line; do
              echo "::error ::ctx: ${line:0:850}"
            done
          else
            tail -n 6 /tmp/build.log | while IFS= read -r line; do
              echo "::error ::tail: ${line:0:850}"
            done
          fi

      - name: Save full build log to build-log branch
        if: failure()
        run: |
          [ -f /tmp/build.log ] || exit 0
          cp /tmp/build.log build-failure.log
          gzip -9 -f build-failure.log
          ls -l build-failure.log.gz
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          git add -f build-failure.log.gz
          git commit -m "build failure log for ${GITHUB_SHA}" || true
          git push -f origin build-log

      - name: Collect firmware
        run: |
          mkdir -p output
          cp -v bin/targets/qualcommax/arm/*redmi_ax3000* output/ || true
          cp -v bin/targets/qualcommax/arm/sha256sums output/ || true
          ls -l output

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-redmi_ax3000
          path: output/*
          if-no-files-found: error
